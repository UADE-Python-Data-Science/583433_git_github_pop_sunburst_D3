<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Población mundial por región</title>
<meta name="description" content="Zoomable sunburst de D3 con la población por región y país (World Bank, WDI).">
<style>
  :root {
    color-scheme: light;
    --surface:   #fcfcfb;
    --surface-2: #f3f2ee;
    --border:    #e2e0da;
    --text-1:    #0b0b0b;
    --text-2:    #52514e;
    --text-3:    #7a7975;
    /* Colores por región (orden fijo por código, no por ranking) */
    --r-EAS: #2a78d6; --r-ECS: #eb6834; --r-LCN: #1baf7a; --r-MEA: #eda100;
    --r-NAC: #e87ba4; --r-SAS: #008300; --r-SSF: #6250d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --surface-2: #242422; --border: #3a3a37;
      --text-1: #f0efec; --text-2: #c3c2b7; --text-3: #94938b;
      --r-EAS: #3987e5; --r-ECS: #d95926; --r-LCN: #199e70; --r-MEA: #c98500;
      --r-NAC: #d55181; --r-SAS: #008300; --r-SSF: #9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --surface-2: #242422; --border: #3a3a37;
    --text-1: #f0efec; --text-2: #c3c2b7; --text-3: #94938b;
    --r-EAS: #3987e5; --r-ECS: #d95926; --r-LCN: #199e70; --r-MEA: #c98500;
    --r-NAC: #d55181; --r-SAS: #008300; --r-SSF: #9085e9;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text-1);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--text-2); margin: 0 0 20px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; padding: 0; list-style: none; font-size: 13px; color: var(--text-2); }
  .legend li { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .legend li:hover { color: var(--text-1); }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .chart { position: relative; width: 100%; max-width: 760px; margin: 0 auto; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart path { stroke: var(--surface); stroke-width: 1px; }
  .chart text.lbl { fill: var(--text-1); font-size: 11px; }

  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
  .center .c-name { font-weight: 600; font-size: clamp(13px, 2.4vw, 18px); max-width: 26%; line-height: 1.2; }
  .center .c-val  { font-size: clamp(18px, 4vw, 30px); font-variant-numeric: tabular-nums; font-weight: 600; }
  .center .c-pct  { color: var(--text-2); font-size: 13px; }
  .center .c-hint { color: var(--text-3); font-size: 12px; margin-top: 4px; }

  .tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface); color: var(--text-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
    max-width: 240px; z-index: 10;
  }
  .tip b { display: block; margin-bottom: 2px; }
  .tip .row { display: flex; justify-content: space-between; gap: 12px; color: var(--text-2); }
  .tip .row span:last-child { color: var(--text-1); font-variant-numeric: tabular-nums; }

  details { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 12px; }
  summary { cursor: pointer; color: var(--text-2); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--text-2); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  footer { margin-top: 24px; color: var(--text-3); font-size: 12px; }
  footer a { color: inherit; }
  .error { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--text-2); }
  .error code { color: var(--text-1); }
</style>
</head>
<body>
<main>
  <h1>Población mundial por región y país</h1>
  <p class="sub" id="sub">Cargando datos…</p>

  <ul class="legend" id="legend"></ul>
  <div class="chart" id="chart">
    <div class="center" aria-live="polite">
      <div class="c-name" id="c-name"></div>
      <div class="c-val" id="c-val"></div>
      <div class="c-pct" id="c-pct"></div>
      <div class="c-hint" id="c-hint"></div>
    </div>
  </div>

  <details>
    <summary>Ver datos en tabla</summary>
    <table id="table"></table>
  </details>

  <footer id="footer">
    Fuente: Banco Mundial, World Development Indicators (SP.POP.TOTL).
    Gráfico basado en <a href="https://observablehq.com/@d3/zoomable-sunburst">Zoomable Sunburst</a> de D3.
  </footer>
</main>
<div class="tip" id="tip" role="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
// Formatos numéricos (es-AR)
const nf  = new Intl.NumberFormat("es-AR");
const pf  = new Intl.NumberFormat("es-AR", { style: "percent", maximumFractionDigits: 1 });
const mf  = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 1 });
const millones = v => v >= 1e9 ? `${mf.format(v / 1e9)} mil M` : `${mf.format(v / 1e6)} M`;

d3.json("data/poblacion.json")
  .then(draw)
  .catch(err => {
    console.error(err);
    document.getElementById("sub").innerHTML = "";
    document.getElementById("chart").innerHTML =
      `<div class="error"><b>No se pudieron cargar los datos.</b><br>
       Si abriste el archivo con doble clic (<code>file://</code>), levantá un servidor local:
       <code>python -m http.server</code> y entrá a <code>http://localhost:8000</code>.<br>
       Si no existe <code>data/poblacion.json</code>, generalo con <code>python scripts/build_data.py</code>.</div>`;
  });

function draw(data) {
  // ---- Dimensiones (igual que el ejemplo de Observable) ----
  const width = 928;
  const radius = width / 6;

  // Color por región (CSS custom properties -> cambian solas en modo oscuro)
  const css = getComputedStyle(document.documentElement);
  const colorOf = code => css.getPropertyValue(`--r-${code}`).trim() || "#888";

  // ---- Jerarquía + partición ----
  const hierarchy = d3.hierarchy(data)
      .sum(d => d.value)
      .sort((a, b) => b.value - a.value);
  const root = d3.partition()
      .size([2 * Math.PI, hierarchy.height + 1])(hierarchy);
  root.each(d => d.current = d);
  const world = root.value;

  const regionOf = d => { while (d.depth > 1) d = d.parent; return d; };

  // ---- Texto de cabecera ----
  document.getElementById("sub").textContent =
    `${nf.format(world)} habitantes en ${data.year} · ${root.leaves().length} países en ${root.children.length} regiones. ` +
    `Hacé clic en una región para hacer zoom; clic en el centro para volver.`;
  if (data.generated) document.getElementById("footer").insertAdjacentText("beforeend", ` Datos generados el ${data.generated}.`);

  // ---- Leyenda ----
  d3.select("#legend").selectAll("li")
    .data(root.children.slice().sort((a, b) => d3.ascending(a.data.code, b.data.code)))
    .join("li")
      .html(d => `<i style="background:${colorOf(d.data.code)}"></i>${d.data.name}`)
      .on("click", (e, d) => clicked(e, d));

  // ---- Arco ----
  const arc = d3.arc()
      .startAngle(d => d.x0)
      .endAngle(d => d.x1)
      .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
      .padRadius(radius * 1.5)
      .innerRadius(d => d.y0 * radius)
      .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));

  const svg = d3.select("#chart").insert("svg", ".center")
      .attr("viewBox", [-width / 2, -width / 2, width, width])
      .attr("role", "img")
      .attr("aria-label", `Sunburst de población mundial ${data.year} por región y país`);

  const path = svg.append("g")
    .selectAll("path")
    .data(root.descendants().slice(1))
    .join("path")
      .attr("fill", d => colorOf(regionOf(d).data.code))
      .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.85 : 0.55) : 0)
      .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
      .attr("d", d => arc(d.current));

  path.filter(d => d.children)
      .style("cursor", "pointer")
      .on("click", clicked);

  // ---- Tooltip ----
  const tip = document.getElementById("tip");
  path.on("pointermove", (event, d) => {
        const rows = [["Población", nf.format(d.value)], ["% del mundo", pf.format(d.value / world)]];
        if (d.depth === 2) rows.splice(1, 0, [`% de la región`, pf.format(d.value / d.parent.value)]);
        if (d.children) rows.push(["Países", d.children.length]);
        tip.innerHTML = `<b>${d.data.name}</b>` +
          rows.map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join("");
        const x = Math.min(event.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
        const y = Math.min(event.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
        tip.style.left = `${x}px`; tip.style.top = `${y}px`; tip.style.opacity = 1;
      })
      .on("pointerleave", () => tip.style.opacity = 0);

  // ---- Etiquetas ----
  const label = svg.append("g")
      .attr("pointer-events", "none")
      .attr("text-anchor", "middle")
      .style("user-select", "none")
    .selectAll("text")
    .data(root.descendants().slice(1))
    .join("text")
      .attr("class", "lbl")
      .attr("dy", "0.35em")
      .attr("fill-opacity", d => +labelVisible(d.current))
      .attr("transform", d => labelTransform(d.current))
      .text(d => shorten(d.data.name));

  // ---- Círculo central: clic para volver al nivel anterior ----
  const parent = svg.append("circle")
      .datum(root)
      .attr("r", radius)
      .attr("fill", "none")
      .attr("pointer-events", "all")
      .on("click", clicked);

  updateCenter(root);
  updateTable(root);

  // ---- Zoom (lógica del ejemplo original) ----
  function clicked(event, p) {
    parent.datum(p.parent || root);
    parent.style("cursor", p.parent ? "pointer" : "default");

    root.each(d => d.target = {
      x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      y0: Math.max(0, d.y0 - p.depth),
      y1: Math.max(0, d.y1 - p.depth)
    });

    const t = svg.transition().duration(event && event.altKey ? 7500 : 750);

    path.transition(t)
        .tween("data", d => {
          const i = d3.interpolate(d.current, d.target);
          return t => d.current = i(t);
        })
      .filter(function(d) { return +this.getAttribute("fill-opacity") || arcVisible(d.target); })
        .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.85 : 0.55) : 0)
        .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
        .attrTween("d", d => () => arc(d.current));

    label.filter(function(d) { return +this.getAttribute("fill-opacity") || labelVisible(d.target); })
      .transition(t)
        .attr("fill-opacity", d => +labelVisible(d.target))
        .attrTween("transform", d => () => labelTransform(d.current));

    updateCenter(p);
    updateTable(p);
  }

  function arcVisible(d) {
    return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0;
  }
  function labelVisible(d) {
    return d.y1 <= 3 && d.y0 >= 1 && (d.y1 - d.y0) * (d.x1 - d.x0) > 0.03;
  }
  function labelTransform(d) {
    const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
    const y = (d.y0 + d.y1) / 2 * radius;
    return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
  }
  function shorten(s) { return s.length > 24 ? s.slice(0, 23) + "…" : s; }

  function updateCenter(p) {
    document.getElementById("c-name").textContent = p.data.name;
    document.getElementById("c-val").textContent = millones(p.value);
    document.getElementById("c-pct").textContent =
      p.depth ? `${pf.format(p.value / world)} del mundo` : `año ${data.year}`;
    document.getElementById("c-hint").textContent = p.depth ? "clic aquí para volver" : "";
  }

  function updateTable(p) {
    const rows = p.children.slice().sort((a, b) => b.value - a.value);
    document.getElementById("table").innerHTML =
      `<thead><tr><th>${p.depth ? "País" : "Región"}</th><th class="num">Población</th>
       <th class="num">% de ${p.data.name}</th><th class="num">% del mundo</th></tr></thead><tbody>` +
      rows.map(d => `<tr><td>${d.data.name}</td><td class="num">${nf.format(d.value)}</td>
        <td class="num">${pf.format(d.value / p.value)}</td><td class="num">${pf.format(d.value / world)}</td></tr>`).join("") +
      `</tbody>`;
  }
}
</script>
</body>
</html>
